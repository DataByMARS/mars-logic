<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MARS — Website Maintenance</title>

  <meta name="description" content="MARS — Modern Analytics & Research Solutions">

  <link rel="icon" href="assets/favicon-32.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 40px 24px;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .logo {
      width: min(280px, 70vw);
      height: auto;
      margin-bottom: 60px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.65;
      color: #d0d0d0;
    }

    a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    a:hover {
      opacity: 0.75;
    }

    .footer {
      margin-top: 70px;
      font-size: 13px;
      color: #777777;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      class="logo"
      src="assets/MARS_Logo_White.png"
      alt="MARS"
    >

    <h1>Welcome to MARS.</h1>

    <p>
      Our website is currently undergoing maintenance and should be back
      online shortly. For questions or assistance, please contact
      <a href="mailto:dstone@mars-logic.com">dstone@mars-logic.com</a>.
    </p>

    <div class="footer">
      Modern Analytics &amp; Research Solutions
    </div>

  </main>

</body>
</html>
